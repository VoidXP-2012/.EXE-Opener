<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vs. Impostor Legacy Web Console</title>
    <style>
        /* Erases page borders and frames to create a true app layout */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        /* Forces the web engine port frame to lock to full-screen bounds */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Direct framework embed of the active community port layout -->
    <iframe 
        src="https://gamedistribution.com" 
        allow="autoplay; keyboard; gamepad; fullscreen;" 
        sandbox="allow-same-origin allow-scripts allow-forms allow-modals">
    </iframe>

</body>
</html>
